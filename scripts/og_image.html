<!-- Source for static/website_app/images/og-image.png.

     Regenerate from the repo root, after changing the palette, the wordmark or
     the sprite:

       "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
         --headless --disable-gpu --hide-scrollbars \
         --window-size=1200,630 --virtual-time-budget=6000 \
         --screenshot=website_app/static/website_app/images/og-image.png \
         "file://$PWD/scripts/og_image.html"
       python manage.py collectstatic --noinput

     Built from the site's own materials rather than drawn separately — same
     font file, same sprite, same paper and grain — so a link preview looks like
     the page it points at. The sprite is base64 because a file:// mask-image
     does not resolve in headless Chrome, and it is scaled 2x exactly: this is
     pixel art and any fractional scale eats the single-pixel sparkles.

     Keep it PNG. The grain is high-frequency noise, so JPEG is both larger
     (302K at q88 against 271K) and softer on the type. -->

<style>

.domain{
